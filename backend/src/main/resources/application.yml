spring:
  application:
    name: novi-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:novi}
    username: ${DB_USER:novi}
    password: ${DB_PASSWORD:novi}

  jpa:
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway migrations, not Hibernate auto-DDL
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      # Phase 3 book-scanner photo uploads. Bookshelf photos can be large.
      max-file-size: ${MAX_UPLOAD_SIZE:15MB}
      max-request-size: ${MAX_UPLOAD_SIZE:15MB}

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

novi:
  security:
    jwt:
      # The committed default is a PUBLIC value usable only for local dev. The
      # app refuses to start with it unless a dev/test/local profile is active
      # (e.g. SPRING_PROFILES_ACTIVE=dev); any real deployment MUST set a strong,
      # unique JWT_SECRET of at least 32 bytes. See JwtService.
      secret: ${JWT_SECRET:change-this-development-only-secret-key-please-32bytes+}
      expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24h
    # Comma-separated usernames granted ROLE_ADMIN (e.g. for /api/books/backfill-embeddings).
    admin-usernames: ${ADMIN_USERNAMES:}
    cors:
      # Comma-separated browser origins allowed to call the API. Localhost-only
      # by default for dev; set CORS_ALLOWED_ORIGINS to your real frontend origin(s).
      allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS:http://localhost:*}
    rate-limit:
      # Per-client-IP cap on the unauthenticated auth endpoints (login/register)
      # to blunt brute-force and signup spam.
      auth:
        max-requests: ${AUTH_RATE_LIMIT_MAX:10}
        window-seconds: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:60}
        # X-Forwarded-For is spoofable, so it's ignored by default (the limiter
        # keys on the socket address). Set this true ONLY when the app sits
        # behind a trusted reverse proxy (e.g. nginx) that overwrites the header
        # with the real client IP.
        trust-forwarded-for: ${AUTH_RATE_LIMIT_TRUST_XFF:false}

  ai:
    # Embeddings: Voyage AI (Anthropic's recommended embedding partner - there
    # is no native Anthropic embeddings endpoint). Get a key at
    # https://dashboard.voyageai.com/. Recommendations degrade gracefully
    # (falling back to genre/author overlap) if this is left blank.
    voyage:
      api-key: ${VOYAGE_API_KEY:}
      model: ${VOYAGE_MODEL:voyage-3.5}
      base-url: ${VOYAGE_BASE_URL:https://api.voyageai.com/v1}

    # Reranking, explanations, natural-language query interpretation, theme
    # tagging, and the reading-personality summary all use the Anthropic
    # Messages API. Without a key, Novi falls back to a deterministic,
    # non-AI ranking (see RecommendationRerankingService) so the rest of the
    # app keeps working end-to-end.
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      model: ${ANTHROPIC_MODEL:claude-sonnet-5}
      base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com/v1}

    candidate-pool-size: ${NOVI_CANDIDATE_POOL_SIZE:100}
    recommendation-count: ${NOVI_RECOMMENDATION_COUNT:10}
    # Upper bound on books loaded and scored per recommendation request, so a
    # large catalog can't be pulled into memory wholesale. A vector index is the
    # proper fix for very large catalogs (see README).
    max-scan-books: ${NOVI_MAX_SCAN_BOOKS:5000}

logging:
  level:
    com.novi: INFO

management:
  endpoints:
    web:
      exposure:
        include: health
