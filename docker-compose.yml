services:
  db:
    image: postgres:16-alpine
    container_name: novi-db
    environment:
      POSTGRES_DB: novi
      POSTGRES_USER: novi
      POSTGRES_PASSWORD: novi
    ports:
      - "5432:5432"
    volumes:
      - novi-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novi"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: novi-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: novi
      DB_USER: novi
      DB_PASSWORD: novi
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET before starting Novi}
      # Phase 2 AI providers - optional. Without these, recommendations still
      # work end-to-end using a genre-overlap fallback instead of embeddings/LLM reranking.
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    container_name: novi-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  novi-db-data:
