services:
  db:
    # pgvector-enabled Postgres: the recommendation engine stores book
    # embeddings in a native vector column with an HNSW index (see V6 migration).
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: novi
      POSTGRES_USER: novi
      POSTGRES_PASSWORD: novi
    ports:
      - "5432:5432"
    volumes:
      - novi-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novi"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: novi
      DB_USER: novi
      DB_PASSWORD: novi
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET before starting Novi}
      # Browser origin(s) allowed to call the API. Must match the frontend's
      # real URL in a deployment, otherwise the browser blocks requests (CORS).
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      # Google Gemini powers both the natural-language query understanding +
      # grounded explanations and the book embeddings. OPTIONAL: without a key,
      # Novi still works end-to-end (lexical retrieval + deterministic
      # explanations). Get a key at https://aistudio.google.com/apikey.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-lite-latest}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}
      NOVI_EMBEDDING_DIMENSIONS: ${NOVI_EMBEDDING_DIMENSIONS:-768}
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  novi-db-data:
